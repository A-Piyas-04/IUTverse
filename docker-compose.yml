# IUTverse: the whole stack in Docker.
#
#   docker-compose build
#   docker-compose up
#
# Then open http://localhost:8080 and sign up with any @iut-dhaka.edu address
# (email confirmation is off locally).
#
# Google sign-in is off by default. To turn it on, set GOOGLE_OAUTH_ENABLED=true,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and OAUTH_PROVIDERS=google (the last one
# shows the button; rebuild after changing it). See docs/oauth-setup.md.
#
# Everything here is a local-development default and works without any .env
# file. The JWT secret and the anon/service keys are Supabase's published demo
# values for local stacks: they only work against this stack and must never be
# used for a hosted project. To change ports, set WEB_PORT or SUPABASE_PORT
# (in the shell or a .env file next to this one). The web port is baked into the
# page build, so rebuild after changing it.
#
# Ports are published on 127.0.0.1 only: the stack is not reachable from the
# network, and on Windows/WSL2 it avoids wslrelay intercepting IPv6 localhost.

name: iutverse

x-supabase: &supabase
  JWT_SECRET: &jwt-secret super-secret-jwt-token-with-at-least-32-characters-long
  ANON_KEY: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SERVICE_ROLE_KEY: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  POSTGRES_PASSWORD: &db-password postgres

services:
  # ---------------------------------------------------------------- Supabase
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.004
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: *db-password
      JWT_SECRET: *jwt-secret
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/supabase/db/schema.sql:/etc/postgresql.schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 30

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${SUPABASE_PORT:-8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${WEB_PORT:-8080}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${WEB_PORT:-8080}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # No mail server locally, so new accounts are confirmed immediately.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      # Only @iut-dhaka.edu sign-ups (function created by the migrations).
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/public/hook_restrict_iut_signup
      # Google OAuth. The hook above refuses non-IUT Google accounts too.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: http://localhost:${SUPABASE_PORT:-8000}/auth/v1/callback
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.82.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: *anon-key
      SERVICE_KEY: *service-key
      AUTH_JWT_SECRET: *jwt-secret
      DATABASE_URL: postgresql://supabase_storage_admin:postgres@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Applies the IUTverse migrations (they need the auth and storage schemas)
  # and loads the starter data, then exits.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DIRECT_URL: postgresql://postgres:postgres@db:5432/postgres?sslmode=disable
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.4
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgresql://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: *jwt-secret

  realtime:
    image: public.ecr.aws/supabase/realtime:v2.143.4
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default:
        aliases: [realtime-dev]
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: *db-password
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: *jwt-secret
      METRICS_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: iutverse-local-realtime-secret-key-base-for-development-only-0000
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      ERL_AFLAGS: -proto_dist inet_tcp
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H Host:realtime-dev http://127.0.0.1:4000/api/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      rest:
        condition: service_started
      realtime:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SUPABASE_PORT:-8000}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_NGINX_WORKER_PROCESSES: 1
    volumes:
      - ./docker/supabase/kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- IUTverse
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The whole application: pages and API in one Next.js server.
  web:
    build:
      context: .
      target: web
      args:
        # Public values baked into the browser bundle.
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:${SUPABASE_PORT:-8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: *anon-key
        NEXT_PUBLIC_OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:3000"
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:${SUPABASE_PORT:-8000}
      SUPABASE_ANON_KEY: *anon-key
      SUPABASE_SERVICE_ROLE_KEY: *service-key
      REDIS_URL: redis://redis:6379
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      KLIPY_API_KEY: ${KLIPY_API_KEY:-}
      EMAIL_USER: ""
      EMAIL_PASS: ""

volumes:
  db-data:
  storage-data:
