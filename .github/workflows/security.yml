name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # A fresh checkout contains only tracked files, so this is the tracked tree.
      - name: gitleaks (tracked files)
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: gitleaks (commits in this pull request)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Built-in secret scanner
        working-directory: Codebase/server
        run: |
          node scripts/scanSecrets.js --self-test
          node scripts/scanSecrets.js
