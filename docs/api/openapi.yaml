      properties:
        purpose:
          type: string
          enum:
            - avatar
            - cover
            - post
            - lostFound
            - catPost
            - event
            - resource
            - chat
        mimeType:
          type: string
          description: Must be allowed for the purpose (images, PDF for `resource`/`chat`, video/audio for `chat`).
        size:
          type: integer
          minimum: 1
          description: 'Bytes. Limits: avatar 2 MB, cover/post/lostFound/catPost/event 5 MB, resource 10 MB, chat 10 MB (video 50 MB).'
        conversationId:
          type: integer
          minimum: 1
          description: Required when purpose is `chat`.
    UploadIntent:
      type: object
      required:
        - purpose
        - bucket
        - path
        - token
        - signedUrl
        - mimeType
        - maxBytes
      properties:
        purpose:
          type: string
        bucket:
          type: string
        path:
          type: string
          description: Pass this back as `uploadPath` to the route that uses the file. The upload is an unused orphan until a route claims it.
        token:
          type: string
          description: Supabase Storage signed-upload token. Short lived; do not log.
        signedUrl:
          type: string
          format: uri
          description: Where to PUT the file bytes. The client-facing Storage address (not the server's internal one), with the secret token in its query. Never log it, and never send the bearer token to it.
        mimeType:
          type: string
        maxBytes:
          type: integer
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the signed upload stops working, read from the token's own expiry. Null if it could not be read. Upload before this time; request a new intent afterwards.
