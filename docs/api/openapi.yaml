  headers:
    XRequestId:
      description: Correlation id for the request. The server echoes a client-supplied `X-Request-Id` when it is well formed, otherwise it generates one. Quote it in bug reports.
      schema:
        type: string
        maxLength: 128
  responses:
    E429:
      description: Rate limit exceeded (fixed window, per client address; see the RateLimit headers).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          description: Seconds until the window resets.
          schema:
            type: integer
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
        RateLimit-Policy:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E500:
      description: Unexpected server error. The body never contains internal detail in production.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E400:
      description: Malformed or invalid request (validation failure, bad identifier, missing field).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E401:
      description: No bearer token was sent (`code` AUTH_TOKEN_REQUIRED) or the endpoint rejected anonymous callers.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E403:
      description: The token is invalid or expired (`code` AUTH_TOKEN_INVALID), the account is not an active member (`code` MEMBERSHIP_REQUIRED), or the caller lacks the role or ownership the operation needs. Note that an expired access token is reported as 403, not 401.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E404:
      description: The resource does not exist, or the caller is not allowed to know it exists.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E502:
      description: An upstream service (for example the weather provider) failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E503:
      description: The feature is not configured or temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    E409:
      description: Conflict with current state (for example a duplicate), or `code` IDEMPOTENCY_KEY_REUSED when an Idempotency-Key was already used for a different request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number. Values below 1 or non-numeric values fall back to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. The default and the maximum differ per endpoint (defaults 10 to 20, maximums 50 or 100); out-of-range values are clamped by the server rather than rejected.
      schema:
        type: integer
        minimum: 1
    RedirectFlag:
      name: redirect
      in: query
      required: false
      description: Send redirect=false to receive the signed URL as JSON (url and expiresAt) instead of a 302 redirect. The same authorization applies. Any other value keeps the redirect.
      schema:
        type: string
        enum:
          - 'false'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes a retry safe. Send 16 to 64 characters of A-Z a-z 0-9 _ - (a UUID works) and send the SAME value when you retry the same action, for example after a timeout. A retry returns the resource that was already created and sets the response header Idempotent-Replayed to true; the same key with different content is refused with 409 IDEMPOTENCY_KEY_REUSED. Keys are scoped to the signed-in member. Omit it for the previous behavior.
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,64}$
