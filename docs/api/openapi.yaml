components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token (JWT)
  schemas:
    PaginationMeta:
      type: object
      description: 'Page metadata. `page`, `limit` and `totalPages` are always present. The total count key differs by endpoint: `total` (most), `totalPosts` (posts, feed), `totalComments` (post comments). Clients must read whichever is present.'
      required:
        - page
        - limit
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        totalPosts:
          type: integer
          minimum: 0
        totalComments:
          type: integer
          minimum: 0
      additionalProperties: true
    SuccessEnvelope:
      type: object
      description: Standard success envelope. `data` is present on most responses; its shape is operation-specific.
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
        data: {}
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      additionalProperties: true
    ErrorBody:
      type: object
      description: 'Error body. `message` is always present. `success: false` is present on most errors but not all (some controllers answer `{ message }` only). `code` is a stable machine-readable value and is currently emitted by the authentication step and by Idempotency-Key handling only; clients must not require it elsewhere.'
      required:
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        message:
          type: string
        code:
          type: string
          description: Stable error code. Unknown values must be treated as a generic error of that HTTP status.
          enum:
            - AUTH_TOKEN_REQUIRED
            - AUTH_TOKEN_INVALID
            - MEMBERSHIP_REQUIRED
            - IDEMPOTENCY_KEY_INVALID
            - IDEMPOTENCY_KEY_REUSED
        error:
          type: string
          description: Internal detail. Only sent when the server runs with EXPOSE_ERRORS outside production.
      additionalProperties: true
    SignedUrl:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: A signed URL. Treat it as a secret while it is valid; never log it.
        expiresAt:
          type: string
          format: date-time
          description: When the URL stops working. Ask the endpoint again for a fresh one while you are still authorized.
    SignedUrlEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/SignedUrl'
    GenericObject:
      type: object
      description: A JSON object whose fields are not yet documented (contract status `inferred`).
      additionalProperties: true
    Me:
      type: object
      description: Identity of the authenticated, active member.
      required:
        - id
        - email
        - role
        - membershipStatus
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - user
            - mod
            - admin
        membershipStatus:
          type: string
          description: Always `active` on a successful call.
    MeEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/Me'
    ValidateTokenResponse:
      type: object
      description: Bare body (no `success`, no `data`).
      required:
        - message
        - user
      properties:
        message:
          type: string
        user:
          type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            name:
              type: string
              nullable: true
            role:
              type: string
    SendMessageRequest:
      type: object
      description: JSON or multipart (multipart sends every value as text). One of a file, a GIF or a shared post per message.
      required:
        - conversationId
      properties:
        conversationId:
          type: integer
          minimum: 1
        content:
          type: string
          maxLength: 4000
        uploadPath:
          type: string
          description: Object path from POST /api/uploads (purpose chat), instead of sending the file.
        attachmentName:
          type: string
          maxLength: 200
        attachmentWidth:
          type: integer
          minimum: 1
          maximum: 20000
        attachmentHeight:
          type: integer
          minimum: 1
          maximum: 20000
        attachmentDurationMs:
          type: integer
          minimum: 0
          maximum: 3600000
        attachmentWaveform:
          description: Waveform samples for voice messages.
        gifUrl:
          type: string
          format: uri
        gifWidth:
          type: integer
          minimum: 1
          maximum: 4000
        gifHeight:
          type: integer
          minimum: 1
          maximum: 4000
        sharedPostId:
          type: integer
          minimum: 1
    ChatAttachment:
      type: object
      nullable: true
      properties:
        url:
          type: string
          nullable: true
          description: Signed URL valid for about one hour. Refresh by fetching the message list or GET /api/chat/attachments/{messageId}?redirect=false.
        name:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        size:
          type: integer
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        durationMs:
          type: integer
          nullable: true
        waveform:
          type: array
          nullable: true
          items:
            type: number
    MemberSummary:
      type: object
      nullable: true
      description: Minimal public member card embedded in posts, comments and reactions. Null for anonymous content or when the profile is missing.
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        handle:
          type: string
          nullable: true
        batch:
          type: integer
          nullable: true
        department:
          type: string
          nullable: true
        profilePictureUrl:
          type: string
          nullable: true
          description: Public URL, absolute when Storage is configured.
        profile:
          type: object
          properties:
            profilePicture:
              type: string
              nullable: true
              description: Storage object path.
    ChatMessage:
      type: object
      required:
        - id
        - conversationId
        - senderId
        - kind
        - content
        - sentAt
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: string
          format: uuid
        receiverId:
          type: string
          nullable: true
          description: Always null; kept for compatibility.
        kind:
          type: string
          enum:
            - text
            - image
            - video
            - audio
            - file
            - gif
            - post
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        editedAt:
          type: string
          format: date-time
          nullable: true
        isRead:
          type: boolean
        attachment:
          $ref: '#/components/schemas/ChatAttachment'
        attachmentUrl:
          type: string
          nullable: true
        attachmentName:
          type: string
          nullable: true
        gif:
          type: object
          nullable: true
          properties:
            url:
              type: string
            width:
              type: integer
            height:
              type: integer
        sharedPost:
          type: object
          nullable: true
          additionalProperties: true
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji:
                type: string
              userId:
                type: string
                format: uuid
        sender:
          $ref: '#/components/schemas/MemberSummary'
    SendMessageResponse:
      type: object
      description: Bare body (no `success`).
      required:
        - message
        - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/ChatMessage'
    CommentUpdateRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          maxLength: 2000
    Comment:
      type: object
      required:
        - id
        - postId
        - content
        - createdAt
        - isAnonymous
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null for anonymous comments.
        authorId:
          type: string
          format: uuid
          nullable: true
          description: Null for anonymous comments.
        isAnonymous:
          type: boolean
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        parentCommentId:
          type: integer
          nullable: true
        user:
          $ref: '#/components/schemas/MemberSummary'
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        _count:
          type: object
          properties:
            replies:
              type: integer
    CommentEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/Comment'
    MessageEnvelope:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
      additionalProperties: true
    CommentListEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    ReactionSummary:
      type: object
      description: Count per reaction type. All seven keys are always present.
      required:
        - like
        - funny
        - relatable
        - angry
        - insightful
        - helpful
        - wholesome
      properties:
        like:
          type: integer
        funny:
          type: integer
