openapi: 3.0.3
info:
  title: IUTverse API
  version: 1.0.0
  description: |-
    HTTP API of the IUTverse web application, consumed by the web client and the IUTverse mobile app.

    This document describes the API **as implemented** at the backend commit recorded in the published `contract-metadata.json`. Operations carry `x-priority` (P0 mobile foundation, P1 feature parity, other) and `x-contract-status` (`verified` = checked by a conformance test, `reviewed` = schema derived by reading the handler, `inferred` = status codes and field names scanned from the handler only).

    Authentication: `Authorization: Bearer <Supabase access token>`. A missing token is 401; an invalid or expired token, a non-member, or insufficient role is 403.

    Tracing: send `X-Request-Id`; the server echoes it (or generates one) on every response.
  license:
    name: MIT
servers:
  - url: "{origin}"
    description: The IUTverse deployment; all paths below already include the /api prefix.
    variables:
      origin:
        default: http://localhost:8080
        description: Scheme and host, no trailing slash.
