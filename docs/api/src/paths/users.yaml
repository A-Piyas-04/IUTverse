# Path items for the "users" area. Generated once by a static scan of the route files, then maintained by hand.
# x-contract-status: verified = checked by a conformance test; reviewed = schema derived by reading the handler; inferred = status codes and field names scanned from the handler only.
api_user_userId:
  get:
    operationId: user_getUserById
    tags:
      - Users
    summary: Public member by id
    x-priority: P0
    x-contract-status: verified
    x-source: src/app/api/user/[userId]/route.ts -> src/server/controllers/userController.ts#getUserById
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/PublicUserEnvelope
      "400":
        $ref: ../components/responses.yaml#/E400
      "401":
        $ref: ../components/responses.yaml#/E401
      "403":
        $ref: ../components/responses.yaml#/E403
      "404":
        $ref: ../components/responses.yaml#/E404
      "429":
        $ref: ../components/responses.yaml#/E429
      "500":
        $ref: ../components/responses.yaml#/E500
