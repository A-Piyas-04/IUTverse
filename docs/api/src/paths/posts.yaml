# Path items for the "posts" area. Generated once by a static scan of the route files, then maintained by hand.
# x-contract-status: verified = checked by a conformance test; reviewed = schema derived by reading the handler; inferred = status codes and field names scanned from the handler only.
api_comments_commentId_replies:
  get:
    operationId: comments_getCommentReplies
    tags:
      - Posts
    summary: List replies to a comment
    x-priority: P0
    x-contract-status: reviewed
    x-source: src/app/api/comments/[commentId]/replies/route.ts -> src/server/controllers/commentController.ts#getCommentReplies
    security:
      - bearerAuth: []
    parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/CommentListEnvelope
      "400":
        $ref: ../components/responses.yaml#/E400
      "401":
        $ref: ../components/responses.yaml#/E401
      "403":
        $ref: ../components/responses.yaml#/E403
      "429":
        $ref: ../components/responses.yaml#/E429
      "500":
        $ref: ../components/responses.yaml#/E500
