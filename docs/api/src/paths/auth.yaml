# Path items for the "auth" area. Generated once by a static scan of the route files, then maintained by hand.
# x-contract-status: verified = checked by a conformance test; reviewed = schema derived by reading the handler; inferred = status codes and field names scanned from the handler only.
api_auth_login:
  post:
    operationId: auth_login
    tags:
      - Auth
    summary: Login
    x-priority: other
    x-contract-status: inferred
    x-source: src/app/api/auth/login/route.ts -> src/server/controllers/authController.ts#login
    x-rate-limit-class: authLimiter
    security: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              email: {}
              password: {}
            additionalProperties: true
    responses:
      "200":
        description: Success
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/GenericObject
      "400":
        $ref: ../components/responses.yaml#/E400
      "401":
        $ref: ../components/responses.yaml#/E401
      "403":
        $ref: ../components/responses.yaml#/E403
      "429":
        $ref: ../components/responses.yaml#/E429
      "500":
        $ref: ../components/responses.yaml#/E500
