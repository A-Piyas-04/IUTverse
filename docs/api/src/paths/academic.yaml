api_academic_resources_id_file:
  get:
    operationId: academic_resourceFile
    tags:
      - Academic
    summary: Open a resource file (302 to a signed URL, or JSON with redirect=false)
    x-priority: P1
    x-contract-status: verified
    x-source: src/app/api/academic/resources/[id]/file/route.ts -> src/server/controllers/communityController.ts#resourceFile
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - $ref: ../components/parameters.yaml#/RedirectFlag
    responses:
