api_chat_messages:
  post:
    operationId: chat_sendMessage
    tags:
      - Chat
    summary: Send a message (idempotent with Idempotency-Key)
    x-priority: P1
    x-contract-status: verified
    x-source: src/app/api/chat/messages/route.ts -> src/server/controllers/chatController.ts#sendMessage
    x-rate-limit-class: createLimiter
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/SendMessageRequest
        multipart/form-data:
          schema:
            allOf:
              - $ref: ../components/schemas.yaml#/SendMessageRequest
              - type: object
                properties:
                  attachment:
                    type: string
                    format: binary
    responses:
      "201":
        description: Created, or a replay of an earlier request with the same Idempotency-Key
        headers:
          Idempotent-Replayed:
            description: true when this response is a replay of an earlier request with the same Idempotency-Key.
            schema:
              type: string
              enum:
                - "true"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SendMessageResponse
      "400":
        $ref: ../components/responses.yaml#/E400
      "401":
        $ref: ../components/responses.yaml#/E401
      "403":
        $ref: ../components/responses.yaml#/E403
      "409":
        $ref: ../components/responses.yaml#/E409
      "429":
        $ref: ../components/responses.yaml#/E429
      "500":
        $ref: ../components/responses.yaml#/E500
    parameters:
      - $ref: ../components/parameters.yaml#/IdempotencyKey
