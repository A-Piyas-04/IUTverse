# Path items for the "chat" area. Generated once by a static scan of the route files, then maintained by hand.
# x-contract-status: verified = checked by a conformance test; reviewed = schema derived by reading the handler; inferred = status codes and field names scanned from the handler only.
api_chat_attachments_messageId:
  get:
    operationId: chat_getAttachment
    tags:
      - Chat
    summary: Open a chat attachment (302 to a signed URL, or JSON with redirect=false)
    x-priority: P1
    x-contract-status: verified
    x-source: src/app/api/chat/attachments/[messageId]/route.ts -> src/server/controllers/chatController.ts#getAttachment
    security:
      - bearerAuth: []
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - $ref: ../components/parameters.yaml#/RedirectFlag
    responses:
      "200":
        description: "With redirect=false: the signed URL and when it expires"
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/SignedUrlEnvelope
      "302":
        description: Redirect to a signed or public file URL
        headers:
          Location:
            schema:
              type: string
              format: uri
      "401":
        $ref: ../components/responses.yaml#/E401
      "403":
        $ref: ../components/responses.yaml#/E403
      "404":
        $ref: ../components/responses.yaml#/E404
      "429":
        $ref: ../components/responses.yaml#/E429
      "500":
        $ref: ../components/responses.yaml#/E500
